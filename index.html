<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Directory</title>
    <style>
        /* This changes the background color and font for the whole page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        
        /* Styles for the main header title */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        /* A container to keep everything centered and neat */
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* The white boxes for each AI tool */
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* The category tag badge */
        .tag {
            background: #3498db;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            text-transform: uppercase;
        }

        /* The link style */
        a {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>AI Resource Hub</h1>
        <p>Find the absolute best AI tool for whatever you want to achieve.</p>
    </header>
    <div class="container">
        
        <!-- Coding AI Card -->
        <div class="card">
            <span class="tag">Coding</span>
            <h2>ChatGPT & GitHub Copilot</h2>
            <p>The best AI assistants to help you accomplish what you want.</p>
            <a href="https://chatgpt.com" target="_blank">Try it out &rarr;</a>
        </div>

    </div>
</body>
</html>
